name: Build Android app

# Builds LaneTrack.apk and publishes it as the latest release, so it can be
# downloaded straight to a phone from:
# https://github.com/Jayt05/Lanetrack/releases/latest/download/LaneTrack.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - vendor/**
      - android/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - tools/build_www.js
      - .github/workflows/build-android.yml
  workflow_run:            # rebuild after the weekly lane data update, so the app carries fresh lanes
    workflows: ["Build lane data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Copy the web app into the Android project
        run: |
          node tools/build_www.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../LaneTrack.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" LaneTrack.apk \
            --title "LaneTrack 1.0.${{ github.run_number }}" \
            --notes "Android test build from commit ${GITHUB_SHA::7}. On your phone, download LaneTrack.apk below and open it to install or update." \
            --latest
