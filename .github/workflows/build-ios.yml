name: Build iOS app

# Builds an UNSIGNED LaneTrack.ipa and attaches it to the "ios" release:
# https://github.com/Jayt05/Lanetrack/releases/download/ios/LaneTrack.ipa
# Install it with Sideloadly or AltStore, which sign it with your Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - vendor/**
      - ios/**
      - package.json
      - package-lock.json
      - capacitor.config.json
      - tools/build_www.js
      - .github/workflows/build-ios.yml
  workflow_run:
    workflows: ["Build lane data"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Copy the web app into the iOS project
        run: |
          node tools/build_www.js
          npx cap sync ios

      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry LaneTrack.ipa Payload

      - name: Publish to the "ios" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios >/dev/null 2>&1 || gh release create ios --prerelease --latest=false \
            --title "LaneTrack for iPhone (unsigned)" \
            --notes "Unsigned iPhone build. Install LaneTrack.ipa with Sideloadly or AltStore using your Apple ID. Updated automatically on every change."
          gh release upload ios LaneTrack.ipa --clobber
          gh release edit ios --notes "Unsigned iPhone build 1.0.${{ github.run_number }} from commit ${GITHUB_SHA::7}. Install LaneTrack.ipa with Sideloadly or AltStore using your Apple ID."
